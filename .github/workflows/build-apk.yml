name: Build APK

on:
  push:
    branches: [tower]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download three.js for offline play
        run: curl -fsSL https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js -o app/src/main/assets/three.min.js

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: tower-climb-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK as a release (direct download, no zip)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk tower-climb.apk
          gh release delete tower --yes --cleanup-tag || true
          gh release create tower tower-climb.apk --target "${{ github.sha }}" --title "Башня испытаний" --notes "Сборка игры «Башня испытаний». Скачайте tower-climb.apk и установите." 
