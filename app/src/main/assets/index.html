<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
</head>
<body>
<title>Рояль: тренажёр</title>
<style>
:root{--bg:#0b0c10;--ink:#f6f1e7;--glass:rgba(14,14,20,.58);--line:rgba(255,255,255,.18);--gold:#e8c36a;--ok:#4be38a;--bad:#ff5a5a;--kbh:clamp(110px,27vh,190px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;overflow:hidden;touch-action:none}
[hidden]{display:none!important}
.stage{position:fixed;inset:0}
canvas#game{width:100%;height:100%;display:block;touch-action:none}
.ui{position:absolute;inset:0;pointer-events:none;padding:max(8px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 0 max(14px,env(safe-area-inset-left))}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar.r{justify-content:flex-end;position:absolute;right:max(14px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top))}
.chip{pointer-events:auto;font:600 14px "Segoe UI",system-ui,sans-serif;color:var(--ink);background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:999px;padding:9px 15px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--gold);color:#241b05;border-color:transparent}
.chip:active{transform:scale(.96)}
#hud{position:absolute;left:50%;top:max(56px,calc(env(safe-area-inset-top) + 50px));transform:translateX(-50%);width:min(440px,calc(100% - 28px));background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:18px;padding:10px 14px;pointer-events:auto}
#hud .t{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700}
#hud .t span{font-weight:500;opacity:.8;font-size:13px}
#hud .pb{height:6px;background:rgba(255,255,255,.14);border-radius:6px;margin:8px 0;overflow:hidden}
#hud .pb i{display:block;height:100%;width:0;background:var(--gold);transition:width .15s}
#hud .row{display:flex;gap:8px;justify-content:space-between;align-items:center}
#hud .need{font-size:15px}
#hud .need b{color:var(--ok)}
#hud.bad{border-color:var(--bad)}
#toast{position:absolute;left:50%;top:38%;transform:translateX(-50%);background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;padding:10px 18px;font-weight:600;text-align:center}
#kb{position:absolute;left:0;right:0;bottom:0;height:var(--kbh);padding:0 max(8px,env(safe-area-inset-left)) max(4px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-right));pointer-events:none}
#kbwrap{position:relative;height:100%;pointer-events:auto;touch-action:none;border-radius:10px 10px 0 0;overflow:hidden;background:#15110d;padding-top:7px;box-shadow:0 -6px 26px rgba(0,0,0,.45)}
#kbwrap .w{position:absolute;top:7px;bottom:0;background:linear-gradient(#fbf8f0,#e9e2d3);border:1px solid #2a2218;border-top:0;border-radius:0 0 7px 7px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;font-size:11px;color:#7d7261}
#kbwrap .b{position:absolute;top:7px;height:62%;background:linear-gradient(#2b2b30,#07070a);border-radius:0 0 5px 5px;box-shadow:0 3px 5px rgba(0,0,0,.6);z-index:2}
#kbwrap .w.down{background:linear-gradient(#ffd9a0,#f0b768)}
#kbwrap .b.down{background:linear-gradient(#a2601d,#4d2a08)}
#kbwrap .w.guide{background:linear-gradient(#b9ffd5,#5be394)}
#kbwrap .b.guide{background:linear-gradient(#2d9d5e,#0b4a29)}
#kbwrap .w.wrong{background:linear-gradient(#ffb2b2,#ff6a6a)}
.oct{position:absolute;bottom:calc(var(--kbh) + 8px);pointer-events:auto}
.oct.l{left:max(14px,env(safe-area-inset-left))}
.oct.r{right:max(14px,env(safe-area-inset-right))}
.sheet{position:absolute;inset:0;display:grid;place-items:center;background:rgba(5,6,10,.6);pointer-events:auto;padding:16px}
.sheet .box{width:min(520px,100%);max-height:86vh;overflow:auto;background:rgba(18,18,26,.92);border:1px solid var(--line);border-radius:22px;padding:18px;display:grid;gap:10px;touch-action:pan-y}
.sheet h2{margin:0 0 4px;font-size:22px}
.item{display:flex;gap:12px;align-items:center;text-align:left;font:inherit;color:inherit;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;width:100%}
.item:active{transform:scale(.99)}
.item .sw{width:44px;height:44px;border-radius:12px;flex:none}
.item b{display:block;font-size:16px}
.item small{opacity:.7;font-size:13px}
.item.sel{border-color:var(--gold);background:rgba(232,195,106,.14)}
.item .badge{margin-left:auto;font-size:12px;opacity:.8;white-space:nowrap}
.close{font:600 15px "Segoe UI",system-ui,sans-serif;color:#241b05;background:var(--gold);border:0;border-radius:14px;padding:12px;cursor:pointer}
#start{position:absolute;inset:0;display:grid;place-items:center;background:rgba(4,5,8,.7);pointer-events:auto;padding:16px}
#start .box{width:min(420px,100%);text-align:center;display:grid;gap:12px;background:rgba(18,18,26,.9);border:1px solid var(--line);border-radius:24px;padding:24px}
#start h1{margin:0;font-size:30px;font-weight:700;letter-spacing:.01em}
#start p{margin:0;opacity:.82;line-height:1.45}
@media (max-width:700px){.bar.r{top:calc(max(8px,env(safe-area-inset-top)) + 46px)}.chip{padding:8px 12px;font-size:13px}#hud{top:max(100px,calc(env(safe-area-inset-top) + 96px))}}
</style>
<div class="stage" id="stage">
  <canvas id="game"></canvas>
  <div class="ui">
    <div class="bar">
      <button class="chip" id="mapBtn" type="button">🎭 Карта</button>
      <button class="chip" id="viewBtn" type="button">👁 Вид</button>
      <button class="chip" id="songBtn" type="button">🎼 Мелодии</button>
    </div>
    <div class="bar r">
      <button class="chip" id="pedalBtn" type="button">Педаль</button>
      <button class="chip on" id="kbBtn" type="button">Клавиши</button>
    </div>
    <div id="hud" hidden>
      <div class="t"><div id="hSong">Мелодия</div><span id="hCount">0/0</span></div>
      <div class="pb"><i id="hBar"></i></div>
      <div class="row"><div class="need" id="hNeed">Нажми: <b>До</b></div><div><button class="chip" id="hListen" type="button">Слушать</button> <button class="chip" id="hStop" type="button">Выйти</button></div></div>
    </div>
    <div id="toast" hidden></div>
    <button class="chip oct l" id="octDn" type="button">◀ Ниже</button>
    <button class="chip oct r" id="octUp" type="button">Выше ▶</button>
    <div id="kb"><div id="kbwrap"></div></div>
    <div class="sheet" id="sheet" hidden><div class="box" id="sheetBox"></div></div>
    <div id="start"><div class="box">
      <h1>Рояль</h1>
      <p>Сядь за рояль, оглядывайся свайпом по экрану и играй. Звук синтезируется прямо на устройстве. Выбери карту: концертный зал, гостиная, джаз-клуб, терраса или космос.</p>
      <button class="close" id="go" type="button">Сесть за рояль</button>
    </div></div>
  </div>
</div>
<script src="three.min.js"></script>
<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id);};
var canvas=$('game'),stage=$('stage');
var renderer;
try{renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true,powerPreference:'high-performance'});}
catch(e){document.body.insertAdjacentHTML('beforeend','<p style="position:fixed;inset:0;display:grid;place-items:center;color:#fff;padding:20px;text-align:center">Не удалось запустить 3D (WebGL)</p>');return;}
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.0;
renderer.physicallyCorrectLights=true;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
var scene=new THREE.Scene();
var camera=new THREE.PerspectiveCamera(62,1,0.03,260);
camera.rotation.order='YXZ';
scene.add(camera);

function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
var MAXANI=Math.min(8,renderer.capabilities.getMaxAnisotropy?renderer.capabilities.getMaxAnisotropy():1);

/* ---------- procedural textures ---------- */
function ctex(w,h,draw,rx,ry){
  var c=document.createElement('canvas');c.width=w;c.height=h;
  draw(c.getContext('2d'),w,h);
  var t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx||1,ry||1);
  t.encoding=THREE.sRGBEncoding;t.anisotropy=MAXANI;
  return t;
}
function noise(g,w,h,n,a,col){
  for(var i=0;i<n;i++){g.fillStyle=(col||'rgba(0,0,0,')+(Math.random()*a)+')';g.fillRect(Math.random()*w,Math.random()*h,1+Math.random()*2,1+Math.random()*2);}
}
function woodTex(hue,sat,lit,planks,rx,ry){
  return ctex(512,512,function(g,w,h){
    var ph=h/planks;
    for(var p=0;p<planks;p++){
      var l=lit+(Math.random()-0.5)*8,hh=hue+(Math.random()-0.5)*6;
      g.fillStyle='hsl('+hh+','+sat+'%,'+l+'%)';g.fillRect(0,p*ph,w,ph);
      for(var k=0;k<26;k++){
        g.strokeStyle='rgba(0,0,0,'+(0.03+Math.random()*0.07)+')';g.lineWidth=0.6+Math.random()*1.4;
        g.beginPath();var y=p*ph+Math.random()*ph;g.moveTo(0,y);
        g.bezierCurveTo(w*0.3,y+(Math.random()-0.5)*6,w*0.6,y+(Math.random()-0.5)*6,w,y+(Math.random()-0.5)*4);g.stroke();
      }
      for(k=0;k<8;k++){g.strokeStyle='rgba(255,255,255,'+(0.03+Math.random()*0.05)+')';g.lineWidth=1;g.beginPath();y=p*ph+Math.random()*ph;g.moveTo(0,y);g.lineTo(w,y+(Math.random()-0.5)*5);g.stroke();}
      g.fillStyle='rgba(0,0,0,.5)';g.fillRect(0,p*ph,w,1.5);
      var cut=Math.random()*w;g.fillRect(cut,p*ph,1.5,ph);
    }
  },rx,ry);
}
function brickTex(rx,ry){
  return ctex(512,512,function(g,w,h){
    g.fillStyle='#2a1f1c';g.fillRect(0,0,w,h);
    var bh=32,bw=96;
    for(var r=0;r<h/bh;r++){
      for(var c=-1;c<w/bw+1;c++){
        var x=c*bw+(r%2?bw/2:0);
        g.fillStyle='hsl('+(10+Math.random()*10)+','+(35+Math.random()*15)+'%,'+(22+Math.random()*12)+'%)';
        g.fillRect(x+2,r*bh+2,bw-4,bh-4);
      }
    }
    noise(g,w,h,5000,0.18);
  },rx,ry);
}
function plasterTex(col,rx,ry){
  return ctex(256,256,function(g,w,h){g.fillStyle=col;g.fillRect(0,0,w,h);noise(g,w,h,3500,0.07);noise(g,w,h,1500,0.06,'rgba(255,255,255,');},rx,ry);
}
function fabricTex(col,rx,ry,pattern){
  return ctex(256,256,function(g,w,h){
    g.fillStyle=col;g.fillRect(0,0,w,h);
    noise(g,w,h,6000,0.12);
    if(pattern){
      g.strokeStyle='rgba(255,215,140,.55)';g.lineWidth=3;
      g.strokeRect(14,14,w-28,h-28);g.strokeStyle='rgba(255,215,140,.3)';g.lineWidth=1.5;g.strokeRect(28,28,w-56,h-56);
      g.fillStyle='rgba(255,215,140,.35)';
      for(var i=0;i<4;i++){g.beginPath();g.arc(w/2,h/2,26-i*6,0,6.28);g.stroke();}
    }
  },rx,ry);
}
function stoneTex(rx,ry){
  return ctex(512,512,function(g,w,h){
    g.fillStyle='#bfb3a1';g.fillRect(0,0,w,h);
    var n=4,s=w/n;
    for(var i=0;i<n;i++)for(var j=0;j<n;j++){
      var l=62+Math.random()*10;g.fillStyle='hsl(32,18%,'+l+'%)';g.fillRect(i*s+2,j*s+2,s-4,s-4);
    }
    noise(g,w,h,9000,0.12);
  },rx,ry);
}
function sheetTex(){
  return ctex(512,320,function(g,w,h){
    g.fillStyle='#f6f1e4';g.fillRect(0,0,w,h);
    g.strokeStyle='#2b2b2b';g.fillStyle='#2b2b2b';
    for(var s=0;s<4;s++){
      var y0=36+s*74;g.lineWidth=1;
      for(var l=0;l<5;l++){g.beginPath();g.moveTo(24,y0+l*7);g.lineTo(w-20,y0+l*7);g.stroke();}
      g.lineWidth=1.5;g.beginPath();g.moveTo(24,y0);g.lineTo(24,y0+28);g.stroke();
      g.font='38px serif';g.fillText('𝄞',30,y0+30);
      for(var n=0;n<9;n++){
        var x=84+n*44+Math.random()*6,yy=y0+Math.floor(Math.random()*8)*3.5-4;
        g.beginPath();g.ellipse(x,yy,5.4,4,-0.35,0,6.28);g.fill();
        g.lineWidth=1.4;g.beginPath();g.moveTo(x+5,yy);g.lineTo(x+5,yy-24);g.stroke();
      }
    }
  });
}
function glowTex(inner,outer){
  return ctex(128,128,function(g,w,h){
    var r=g.createRadialGradient(w/2,h/2,0,w/2,h/2,w/2);
    r.addColorStop(0,inner);r.addColorStop(1,outer);g.fillStyle=r;g.fillRect(0,0,w,h);
  });
}
function labelTex(text,color,font){
  return ctex(512,160,function(g,w,h){
    g.clearRect(0,0,w,h);g.font=font||'700 96px Georgia,serif';g.textAlign='center';g.textBaseline='middle';
    g.shadowColor=color;g.shadowBlur=24;g.fillStyle=color;g.fillText(text,w/2,h/2);g.fillText(text,w/2,h/2);
  });
}

/* ---------- mesh helpers ---------- */
var UNIT=new THREE.BoxGeometry(1,1,1);
function std(color,rough,metal,extra){
  var o={color:color,roughness:rough===undefined?0.7:rough,metalness:metal||0};
  if(extra)for(var k in extra)o[k]=extra[k];
  return new THREE.MeshStandardMaterial(o);
}
function glow(color,intensity){
  return new THREE.MeshStandardMaterial({color:0x000000,emissive:color,emissiveIntensity:intensity||2,roughness:1});
}
function bx(parent,w,h,d,x,y,z,mat,shadow){
  var m=new THREE.Mesh(UNIT,mat);m.scale.set(w,h,d);m.position.set(x,y,z);
  if(shadow!==false){m.castShadow=true;m.receiveShadow=true;}
  parent.add(m);return m;
}
function cy(parent,rt,rb,h,x,y,z,mat,seg,shadow){
  var m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg||16),mat);m.position.set(x,y,z);
  if(shadow!==false){m.castShadow=true;m.receiveShadow=true;}
  parent.add(m);return m;
}
function sp(parent,r,x,y,z,mat,seg){
  var m=new THREE.Mesh(new THREE.SphereGeometry(r,seg||16,seg?seg*0.7:12),mat);m.position.set(x,y,z);parent.add(m);return m;
}
function plane(parent,w,h,x,y,z,mat,rx,ry){
  var m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),mat);m.position.set(x,y,z);
  m.rotation.set(rx||0,ry||0,0);m.receiveShadow=true;parent.add(m);return m;
}
/* disposal */
function disposeTree(o){
  o.traverse(function(n){
    if(n.geometry&&n.geometry!==UNIT)n.geometry.dispose();
    if(n.material){
      var ms=Array.isArray(n.material)?n.material:[n.material];
      ms.forEach(function(m){for(var k in m){var v=m[k];if(v&&v.isTexture)v.dispose();}m.dispose();});
    }
  });
}

/* ---------- environment (reflections) ---------- */
var pmrem=null;
function makeEnv(top,bottom,lights){
  try{
    if(!pmrem)pmrem=new THREE.PMREMGenerator(renderer);
    var es=new THREE.Scene();
    var geo=new THREE.SphereGeometry(50,24,16);
    var cols=[],pos=geo.attributes.position,ct=new THREE.Color(top),cb=new THREE.Color(bottom),c=new THREE.Color();
    for(var i=0;i<pos.count;i++){
      var t=(pos.getY(i)/50+1)/2;c.copy(cb).lerp(ct,t);cols.push(c.r,c.g,c.b);
    }
    geo.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));
    es.add(new THREE.Mesh(geo,new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.BackSide})));
    (lights||[]).forEach(function(L){
      var m=new THREE.Mesh(UNIT,new THREE.MeshBasicMaterial({color:new THREE.Color(L.c).multiplyScalar(L.i||6)}));
      m.scale.set(L.s[0],L.s[1],L.s[2]);m.position.set(L.p[0],L.p[1],L.p[2]);es.add(m);
    });
    var rt=pmrem.fromScene(es,0.03);
    geo.dispose();
    return rt.texture;
  }catch(e){return null;}
}


/* ======================================================
   GRAND PIANO MODEL (88 keys, A0..C8, metres)
   ====================================================== */
var KW=0.0235,KTOP=0.75,NW=52;
var BLACK_SEMI=[1,3,6,8,10];
function isBlack(m){return BLACK_SEMI.indexOf(m%12)>=0;}
var pianoGroup=new THREE.Group();scene.add(pianoGroup);
var keys={},keyMeshes=[];
var whiteIdxOf={};
(function(){var wi=0;for(var m=21;m<=108;m++){if(!isBlack(m)){whiteIdxOf[m]=wi;wi++;}}})();
function keyX(m){
  if(!isBlack(m))return (whiteIdxOf[m]-(NW-1)/2)*KW;
  return (whiteIdxOf[m-1]+0.5-(NW-1)/2)*KW;
}
function caseShape(i){
  var s=new THREE.Shape();
  var L=-0.68+i,R=0.68-i,F=0.16+i,T=2.15-i;
  s.moveTo(L,F);s.lineTo(R,F);s.lineTo(R,0.95);
  s.bezierCurveTo(R,1.55,R-0.2-i*0.4,1.85,R-0.55,T+0.08-i*0.2);
  s.bezierCurveTo(R-1.0,T+0.2,L+0.5,T+0.14,L,T-0.05);
  s.lineTo(L,F);
  return s;
}
var lacquer=std(0x050507,0.2,0.2,{envMapIntensity:0.45});
var gold=std(0xc79a3a,0.28,0.9,{envMapIntensity:1.2});
var lidGroup;
function buildPiano(){
  var g=pianoGroup;
  /* keys */
  var whiteMat=new THREE.MeshStandardMaterial({color:0xf6f1e6,roughness:0.28,metalness:0,envMapIntensity:0.7});
  var blackMat=new THREE.MeshStandardMaterial({color:0x0c0c0f,roughness:0.22,metalness:0.2,envMapIntensity:1.0});
  var gw=new THREE.BoxGeometry(KW-0.0024,0.022,0.15);gw.translate(0,-0.011,0.075);
  var gb=new THREE.BoxGeometry(0.0135,0.02,0.095);gb.translate(0,-0.01,0.0475);
  for(var m=21;m<=108;m++){
    var blk=isBlack(m);
    var mat=(blk?blackMat:whiteMat).clone();
    mat.emissive=new THREE.Color(0x000000);
    var mesh=new THREE.Mesh(blk?gb:gw,mat);
    mesh.position.set(keyX(m),blk?KTOP+0.027:KTOP,-0.15);
    mesh.castShadow=true;mesh.receiveShadow=true;
    mesh.userData.midi=m;
    g.add(mesh);keyMeshes.push(mesh);
    keys[m]={mesh:mesh,mat:mat,black:blk,a:0,down:0,guide:false,wrong:0};
  }
  /* keybed, cheeks, felt */
  var kb=std(0x15100d,0.5,0.1);
  bx(g,1.40,0.18,0.17,0,0.64,-0.07,lacquer);
  bx(g,0.07,0.34,0.30,-0.645,0.72,-0.04,lacquer);
  bx(g,0.07,0.34,0.30,0.645,0.72,-0.04,lacquer);
  bx(g,1.224,0.012,0.008,0,0.752,-0.155,std(0x8a1020,0.9));
  bx(g,1.224,0.03,0.012,0,0.715,0.012,lacquer);
  /* case */
  var geo=new THREE.ExtrudeGeometry(caseShape(0),{depth:0.3,bevelEnabled:true,bevelThickness:0.012,bevelSize:0.012,bevelSegments:3,curveSegments:28});
  geo.rotateX(-Math.PI/2);
  var cs=new THREE.Mesh(geo,lacquer);cs.position.set(0,0.55,0);cs.castShadow=true;cs.receiveShadow=true;g.add(cs);
  /* nameboard */
  bx(g,1.36,0.15,0.04,0,0.83,-0.18,lacquer);
  bx(g,1.2,0.006,0.002,0,0.86,-0.159,gold,false);
  /* soundboard + harp + strings */
  var sbGeo=new THREE.ShapeGeometry(caseShape(0.035),28);sbGeo.rotateX(-Math.PI/2);
  var sb=new THREE.Mesh(sbGeo,std(0x8a5a2b,0.55,0,{envMapIntensity:0.5}));sb.position.y=0.8625;sb.receiveShadow=true;g.add(sb);

    if(!m)return;
    var semi={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]]+(m[2]==='#'?1:(m[2]==='b'?-1:0));

}

    cfg:{bg:0x02030a,fog:null,exposure:1.05,
      env:{top:0x0c1038,bottom:0x04030c,lights:[{c:0x46e0ff,i:3,s:[8,0.2,0.2],p:[0,-0.2,6]},{c:0xff3aa0,i:3,s:[0.2,2,6],p:[-8,3,-3]},{c:0xffc89a,i:2.5,s:[3,3,3],p:[-30,14,-60]},{c:0xcfe0ff,i:1.5,s:[2,0.2,2],p:[2,7,3]}]},
      reverb:[5.0,0.5],views:[[4.4,1.7,2.6],[0.6,1.8,-4.6]]}
  };
}


var MAPS=[
  {id:'concert',name:'Концертный зал',desc:'Сцена, орган и полный зал слушателей',sw:'linear-gradient(135deg,#7a1428,#2a1410)',build:mapConcert},
  {id:'room',name:'Уютная гостиная',desc:'Камин, книги и ночной город за окном',sw:'linear-gradient(135deg,#d98a3a,#3a2418)',build:mapRoom},
  {id:'jazz',name:'Джаз-клуб',desc:'Неон, кирпич, свечи на столиках',sw:'linear-gradient(135deg,#ff3b9a,#2a1a6a)',build:mapJazz},
  {id:'terrace',name:'Терраса на закате',desc:'Море, гирлянды и розовое небо',sw:'linear-gradient(135deg,#ffb060,#7a3f96)',build:mapTerrace},
  {id:'space',name:'Звёздная сцена',desc:'Платформа среди планет и туманностей',sw:'linear-gradient(135deg,#46e0ff,#150a3a)',build:mapSpace}
];


/* ======================================================
   MAPS: loader
   ====================================================== */
var mapRoot=null,mapObj=null,curMap=-1,envTex=null;
function loadMap(i){
  if(mapRoot){scene.remove(mapRoot);disposeTree(mapRoot);}
  if(envTex){envTex.dispose();envTex=null;}
  curMap=i;
  mapRoot=new THREE.Group();scene.add(mapRoot);
  var M=MAPS[i];
  mapObj=M.build(mapRoot);
  var c=mapObj.cfg;
  scene.background=new THREE.Color(c.bg);
  scene.fog=c.fog?new THREE.Fog(c.fog[0],c.fog[1],c.fog[2]):null;
  renderer.toneMappingExposure=c.exposure||1;
  envTex=makeEnv(c.env.top,c.env.bottom,c.env.lights);
  scene.environment=envTex;
  setReverb(c.reverb[0],c.reverb[1]);
  saveMap(i);
  applyView(true);
}

/* ======================================================
   CAMERA / VIEWS
   ====================================================== */
var yaw=0,pitch=-0.62,camPos=new THREE.Vector3(0,1.24,0.66);
var VIEWS=[
  {name:'Сидя',pos:function(){return [seatX(),1.2,0.6];},look:null,yaw:0,pitch:-0.47},
  {name:'Из зала',pos:function(){return mapObj.cfg.views?mapObj.cfg.views[0]:[3.4,1.6,1.4];},look:[0,0.85,-0.5]},
  {name:'Со стороны сцены',pos:function(){return mapObj.cfg.views?mapObj.cfg.views[1]:[0.6,1.7,-4.2];},look:[0,0.85,0]},
  {name:'Сверху',pos:function(){return [0,4.4,1.2];},look:[0,0.5,-0.7]}
];
var viewIdx=0,tween={t:1,from:null,to:null};
function seatX(){
  var start=12*(kbOct+1),wi=whiteIdxOf[start]!==undefined?whiteIdxOf[start]:23;
  return clamp(((wi+6.5)-(NW-1)/2)*KW*0.55,-0.45,0.45);
}
function lookAngles(p,t){
  var dx=t[0]-p[0],dy=t[1]-p[1],dz=t[2]-p[2];
  return {yaw:Math.atan2(-dx,-dz),pitch:Math.atan2(dy,Math.hypot(dx,dz))};
}
function viewTarget(){
  var V=VIEWS[viewIdx],p=V.pos();
  var a=V.look?lookAngles(p,V.look):{yaw:V.yaw,pitch:V.pitch};
  return {p:p,yaw:a.yaw,pitch:a.pitch};
}
function applyView(instant){
  var T=viewTarget();
  if(instant){camPos.set(T.p[0],T.p[1],T.p[2]);yaw=T.yaw;pitch=T.pitch;tween.t=1;return;}
  tween={t:0,from:{p:camPos.clone(),yaw:yaw,pitch:pitch},to:T};
}
function stepTween(dt){
  if(tween.t>=1){
    if(viewIdx===0){var T=viewTarget();camPos.x+=(T.p[0]-camPos.x)*Math.min(1,dt*4);}
    return;
  }
  tween.t=Math.min(1,tween.t+dt/0.9);
  var k=tween.t*tween.t*(3-2*tween.t),f=tween.from,t=tween.to;
  camPos.set(f.p.x+(t.p[0]-f.p.x)*k,f.p.y+(t.p[1]-f.p.y)*k,f.p.z+(t.p[2]-f.p.z)*k);
  var dy=t.yaw-f.yaw;while(dy>Math.PI)dy-=Math.PI*2;while(dy<-Math.PI)dy+=Math.PI*2;
  yaw=f.yaw+dy*k;pitch=f.pitch+(t.pitch-f.pitch)*k;
}
$('viewBtn').addEventListener('click',function(){
  viewIdx=(viewIdx+1)%VIEWS.length;applyView(false);
  toast('Вид: '+VIEWS[viewIdx].name);
});

/* ======================================================
   POINTERS ON THE 3D VIEW: look around, or play a 3D key
   ====================================================== */
var ray=new THREE.Raycaster(),ndc=new THREE.Vector2(),lookP={},keyP={};
function pick3D(e){
  var r=canvas.getBoundingClientRect();
  ndc.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(ndc,camera);
  var h=ray.intersectObjects(keyMeshes,false);
  return h.length&&h[0].distance<2.6?h[0].object.userData.midi:null;
}
canvas.addEventListener('pointerdown',function(e){
  initAudio();
  var m=pick3D(e);
  try{canvas.setPointerCapture(e.pointerId);}catch(x){}
  if(m!==null){keyP[e.pointerId]=m;pressKey(m,0.8);}
  else lookP[e.pointerId]={x:e.clientX,y:e.clientY};
  e.preventDefault();
});
canvas.addEventListener('pointermove',function(e){
  var lp=lookP[e.pointerId];
  if(lp){
    yaw-=(e.clientX-lp.x)*0.0052;
    pitch=clamp(pitch-(e.clientY-lp.y)*0.0042,-1.45,1.25);
    lp.x=e.clientX;lp.y=e.clientY;tween.t=1;
  }else if(e.pointerId in keyP){
    var m=pick3D(e);
    if(m!==null&&m!==keyP[e.pointerId]){releaseKey(keyP[e.pointerId]);keyP[e.pointerId]=m;pressKey(m,0.8);}
  }
  e.preventDefault();
});
function canvasUp(e){
  delete lookP[e.pointerId];
  if(e.pointerId in keyP){releaseKey(keyP[e.pointerId]);delete keyP[e.pointerId];}
}
canvas.addEventListener('pointerup',canvasUp);
canvas.addEventListener('pointercancel',canvasUp);
canvas.addEventListener('lostpointercapture',canvasUp);
canvas.addEventListener('contextmenu',function(e){e.preventDefault();});
canvas.addEventListener('wheel',function(e){camera.fov=clamp(camera.fov+e.deltaY*0.03,35,90);camera.updateProjectionMatrix();e.preventDefault();},{passive:false});

/* ======================================================
   UI
   ====================================================== */
var elToast=$('toast'),toastT=0,sheet=$('sheet'),sheetBox=$('sheetBox');
function toast(t){elToast.textContent=t;elToast.hidden=false;toastT=2.2;}
function openSheet(){sheet.hidden=false;}
function closeSheet(){sheet.hidden=true;}
sheet.addEventListener('pointerdown',function(e){if(e.target===sheet)closeSheet();});
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e;}
function closeBtn(){var b=el('button','close','Закрыть');b.type='button';b.addEventListener('click',closeSheet);return b;}
$('mapBtn').addEventListener('click',function(){
  sheetBox.innerHTML='';sheetBox.appendChild(el('h2','','Карты'));
  MAPS.forEach(function(M,i){
    var b=el('button','item'+(i===curMap?' sel':''));b.type='button';
    var sw=el('span','sw');sw.style.background=M.sw;
    var tx=el('span');tx.appendChild(el('b','',M.name));tx.appendChild(el('small','',M.desc));
    b.appendChild(sw);b.appendChild(tx);
    b.addEventListener('click',function(){closeSheet();if(i!==curMap){loadMap(i);toast(M.name);}});
    sheetBox.appendChild(b);
  });
  sheetBox.appendChild(closeBtn());openSheet();
});
$('songBtn').addEventListener('click',function(){
  sheetBox.innerHTML='';sheetBox.appendChild(el('h2','','Мелодии'));
  var fr=el('button','item'+(!learn?' sel':''));fr.type='button';
  var s0=el('span','sw');s0.style.background='linear-gradient(135deg,#e8c36a,#a8742a)';
  var t0=el('span');t0.appendChild(el('b','','Свободная игра'));t0.appendChild(el('small','','Играй что хочешь, без подсказок'));
  fr.appendChild(s0);fr.appendChild(t0);
  fr.addEventListener('click',function(){stopLesson();closeSheet();});
  sheetBox.appendChild(fr);
  SONGS.forEach(function(S){
    var b=el('button','item'+(learn&&learn.song===S?' sel':''));b.type='button';
    var sw=el('span','sw');sw.style.background='linear-gradient(135deg,#4be38a,#157a47)';sw.style.display='grid';sw.style.placeItems='center';sw.textContent='♪';sw.style.fontSize='22px';sw.style.color='#052';
    var tx=el('span');tx.appendChild(el('b','',S.name));tx.appendChild(el('small','',S.who));
    b.appendChild(sw);b.appendChild(tx);
    var best=prog.songs&&prog.songs[S.name];
    if(best)b.appendChild(el('span','badge','лучшее '+best+'%'));
    b.addEventListener('click',function(){closeSheet();initAudio();startLesson(S);toast('Нажимай подсвеченную клавишу');});
    sheetBox.appendChild(b);
  });
  sheetBox.appendChild(closeBtn());openSheet();
});
function togglePedal(){
  setPedal(!pedal);$('pedalBtn').classList.toggle('on',pedal);
}
$('pedalBtn').addEventListener('click',togglePedal);
$('kbBtn').addEventListener('click',function(){
  var show=$('kb').hidden;$('kb').hidden=!show;$('kbBtn').classList.toggle('on',show);
  $('octDn').hidden=!show;$('octUp').hidden=!show;
  document.documentElement.style.setProperty('--kbh',show?'':'0px');
  resize();
});
$('octDn').addEventListener('click',function(){setKbOct(kbOct-1);});
$('octUp').addEventListener('click',function(){setKbOct(kbOct+1);});
$('hListen').addEventListener('click',listen);
$('hStop').addEventListener('click',stopLesson);
$('go').addEventListener('click',function(){initAudio();$('start').hidden=true;});

/* ======================================================
   SIZE + LOOP
   ====================================================== */
var pr=Math.min(window.devicePixelRatio||1,2);
function resize(){
  var r=stage.getBoundingClientRect();
  var w=Math.max(2,Math.floor(r.width)),h=Math.max(2,Math.floor(r.height));
  renderer.setPixelRatio(pr);
  renderer.setSize(w,h,false);
  camera.aspect=w/h;
  camera.fov=w/h<1?100:62;
  camera.updateProjectionMatrix();
}
if(window.ResizeObserver)new ResizeObserver(resize).observe(stage);
window.addEventListener('resize',resize);

setKbOct(4);
var startMap=(typeof prog.map==='number'&&MAPS[prog.map])?prog.map:0;
loadMap(startMap);
resize();

var last=0,T=0,slow=0,frames=0;
function frame(ts){
  var dt=Math.min(0.05,(ts-last)/1000||0);last=ts;T+=dt;
  stepTween(dt);
  /* key animation */
  for(var m=21;m<=108;m++){
    var k=keys[m];
    var target=k.down?1:0;
    k.a+=(target-k.a)*Math.min(1,dt*(target?40:14));
    k.mesh.rotation.x=k.a*(k.black?0.032:0.04);
    if(k.wrong>0)k.wrong-=dt;
    var em=0,r=0,g=0,b=0;
    if(k.wrong>0){r=1;g=0.1;b=0.1;em=0.6;}
    else if(k.guide){r=0.2;g=1;b=0.5;em=0.35+0.2*Math.sin(T*6);}
    else if(k.a>0.1){r=1;g=0.55;b=0.15;em=0.5*k.a;}
    if(k.mat.userData.em!==em||k.mat.userData.c!==r+g*3+b*7){
      k.mat.emissive.setRGB(r*em,g*em,b*em);k.mat.userData.em=em;k.mat.userData.c=r+g*3+b*7;
    }
  }
  if(mapObj&&mapObj.update)mapObj.update(T,dt);
  camera.position.copy(camPos);
  camera.rotation.set(pitch,yaw,0);
  renderer.render(scene,camera);
  if(toastT>0){toastT-=dt;if(toastT<=0)elToast.hidden=true;}
  /* adaptive resolution */
  frames++;slow+=dt;
  if(slow>2.5){
    var avg=slow/frames;
    if(avg>0.034&&pr>1){pr=Math.max(1,pr-0.5);resize();}
    slow=0;frames=0;
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(function(ts){last=ts;requestAnimationFrame(frame);});
window.__piano={scene:scene,renderer:renderer,lacquer:lacquer,loadMap:loadMap,setView:function(i){viewIdx=i;applyView(true);},press:pressKey,release:releaseKey,startLesson:startLesson,SONGS:SONGS,look:function(y,p){yaw=y;pitch=p;tween.t=1;}};
})();


</script>
