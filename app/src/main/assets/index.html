<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<title>Укради яйцо</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>
/* Layout: shop button and a stats board on top, the 3D field fills the middle,
   thumb controls at the bottom (translucent thumbstick left, steal button right).
   Look: dark translucent game UI over a bright plastic-brick world. */
:root{
  --bg:#171A21;
  --ink:#FFFFFF;
  --muted:#B8BFCC;
  --panel:rgba(24,27,34,.86);
  --panel-solid:#23272F;
  --line:rgba(255,255,255,.16);
  --blue:#00A2FF;
  --blue-dk:#0072B5;
  --green:#2ED36B;
  --green-dk:#168A44;
  --red:#FF4D4D;
  --red-dk:#A82424;
  --gold:#FFC83D;
  --gold-dk:#B98600;
  --display:'Fredoka','Arial Rounded MT Bold','Trebuchet MS',sans-serif;
  --body:'Nunito','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
[hidden]{display:none!important}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font:700 15px/1.3 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  display:grid;
  grid-template-rows:auto minmax(0,1fr) auto;
  gap:8px;
  overflow:hidden;
  overscroll-behavior:none;
  touch-action:none;
  -webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

/* Top bar */
.hud{display:flex;align-items:flex-start;gap:8px;padding-top:8px;min-width:0}
.spacer{flex:1}
.board{
  display:grid;gap:4px;min-width:min(168px,48vw);
  background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:8px 12px;
}
.row{display:flex;align-items:center;gap:8px;font:600 17px var(--display);font-variant-numeric:tabular-nums}
.row .lbl{color:var(--muted);font-weight:500}
.row b{margin-left:auto;font-weight:700;color:var(--ink)}
.coin{
  width:18px;height:18px;border-radius:50%;flex:none;display:inline-block;
  background:radial-gradient(circle at 35% 30%,#FFF3A8,var(--gold) 55%,#E0A100);
  border:2px solid var(--gold-dk);
}
.egg{
  width:15px;height:19px;flex:none;display:inline-block;
  border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
  background:radial-gradient(circle at 35% 30%,#FFFFFF,#F3E3C0);
  border:2px solid #C9AE76;margin:0 1.5px;
}
.shop-btn{
  font:600 18px var(--display);letter-spacing:.03em;
  background:var(--blue);color:#fff;border-radius:10px;padding:11px 18px;
  box-shadow:0 4px 0 var(--blue-dk);
  white-space:nowrap;
}
.shop-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--blue-dk)}

/* Field */
.stage{position:relative;min-height:0;overflow:hidden}
#game{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  border-radius:14px;border:3px solid rgba(255,255,255,.2);
  box-shadow:0 10px 30px rgba(0,0,0,.5);
  background:linear-gradient(#4BB1FF,#BFE6FF 72%,#E4F6FF);
}
.flash{
  position:absolute;pointer-events:none;background:var(--red);opacity:0;border-radius:14px;
}
.hint{
  position:absolute;left:50%;top:10px;transform:translateX(-50%);
  max-width:calc(100% - 24px);width:max-content;text-align:center;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:7px 14px;font-size:14px;pointer-events:none;
}
.hint b{color:var(--gold)}

/* Controls */
.controls{
  --joy:clamp(128px,40vw,176px);
  --steal:clamp(96px,30vw,126px);
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding-bottom:10px;
}
.joy{
  position:relative;width:var(--joy);height:var(--joy);border-radius:50%;flex:none;
  background:rgba(255,255,255,.1);
  border:3px solid rgba(255,255,255,.34);
  box-shadow:inset 0 0 0 12px rgba(255,255,255,.05);
  touch-action:none;
}
.knob{
  position:absolute;left:50%;top:50%;width:42%;height:42%;border-radius:50%;
  transform:translate(-50%,-50%);
  background:rgba(255,255,255,.5);
  border:3px solid rgba(255,255,255,.85);
  box-shadow:0 4px 10px rgba(0,0,0,.4);
  pointer-events:none;
}
.steal{
  width:var(--steal);height:var(--steal);border-radius:50%;flex:none;
  font:700 clamp(17px,5vw,22px) var(--display);letter-spacing:.03em;
  background:var(--red);
  border:3px solid rgba(255,255,255,.75);
  color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.3);
  box-shadow:0 6px 0 var(--red-dk),0 12px 18px rgba(0,0,0,.4);
  transition:filter .15s,opacity .15s;
}
.steal:disabled{filter:grayscale(.9) brightness(.65);opacity:.7;cursor:default;box-shadow:0 4px 0 #333}
.steal:not(:disabled):active{transform:translateY(4px);box-shadow:0 2px 0 var(--red-dk)}
.steal.ready{animation:pulse .8s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}

/* Shop */
.shop{
  position:fixed;inset:0;z-index:20;display:grid;place-items:end center;
  background:rgba(8,10,14,.7);
  padding-top:max(16px,env(safe-area-inset-top,0px));
  padding-bottom:max(16px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.sheet{
  width:min(440px,100%);background:var(--panel-solid);border:1px solid var(--line);
  border-radius:14px;padding:18px;display:grid;gap:14px;
  box-shadow:0 20px 50px rgba(0,0,0,.55);
}
.sheet h2{margin:0;font:700 28px var(--display);color:var(--ink);text-wrap:balance}
.balance{display:flex;align-items:center;gap:8px;font:600 20px var(--display);font-variant-numeric:tabular-nums}
.card{background:#2D323C;border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px}
.card-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.card-top strong{font:600 19px var(--display)}
.speeds{font:600 18px var(--display);color:var(--green);font-variant-numeric:tabular-nums}
.pips{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.pips i{height:12px;border-radius:3px;background:#444B58}
.pips i.on{background:var(--green)}
.buy{
  display:flex;justify-content:center;align-items:center;gap:8px;
  background:var(--green);color:#052a12;
  border-radius:10px;padding:14px;font:600 20px var(--display);
  box-shadow:0 4px 0 var(--green-dk);font-variant-numeric:tabular-nums;
}
.buy:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--green-dk)}
.buy:disabled{background:#4A515F;color:#A9B0BD;box-shadow:0 4px 0 #2E333D;cursor:default}
.note{margin:0;font-size:14px;color:var(--muted)}
.close{
  background:#3A404B;color:#fff;border-radius:10px;padding:13px;
  font:600 18px var(--display);box-shadow:0 4px 0 #272B33;
}
.close:active{transform:translateY(3px);box-shadow:0 1px 0 #272B33}

@media (max-height:600px){
  .controls{--joy:108px;--steal:92px}
  .hint{display:none}
}
@media (prefers-reduced-motion:reduce){
  .steal.ready{animation:none}
}
</style>

<div class="hud">
  <button class="shop-btn" id="shopBtn" type="button">МАГАЗИН</button>
  <span class="spacer"></span>
  <div class="board" aria-label="Статистика">
    <div class="row"><span class="coin"></span><span class="lbl">Монеты</span><b id="coins">0</b></div>
    <div class="row"><span class="egg"></span><span class="lbl">Яйца</span><b id="delivered">0</b></div>
  </div>
</div>

<div class="stage" id="stage">
  <canvas id="game" width="600" height="700" aria-label="Игровое поле"></canvas>
  <div class="flash" id="flash"></div>
  <div class="hint" id="hint">Загружаю 3D...</div>
</div>

<div class="controls">
  <div class="joy" id="joy" role="application" aria-label="Джойстик"><div class="knob" id="knob"></div></div>
  <button class="steal" id="steal" type="button" disabled>КРАСТЬ</button>
</div>

<div class="shop" id="shop" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="shopTitle">
    <h2 id="shopTitle">Магазин</h2>
    <div class="balance"><span class="coin"></span><span id="shopCoins">0</span></div>
    <div class="card">
      <div class="card-top"><strong>Скорость бега</strong><span class="speeds" id="shopSpeeds"></span></div>
      <div class="pips" id="pips"></div>
      <button class="buy" id="buy" type="button"></button>
    </div>
    <p class="note">Монстр с каждым украденным яйцом бегает чуть быстрее. Прокачивай ноги.</p>
    <button class="close" id="closeShop" type="button">Играть дальше</button>
  </div>
</div>

<script src="three.min.js"></script>
<script>
(function(){
  'use strict';
  /* Gameplay runs in "pixels" (600x700 field). The 3D scene uses units = pixels * K. */
  var W=600,H=700,K=0.1;
  var NEST={x:300,y:250};
  var BASE={x:170,y:570,w:260,h:110};
  var MAX_LVL=10;

  var canvas=document.getElementById('game');
  var stage=document.getElementById('stage');
  var flashEl=document.getElementById('flash');
  var elCoins=document.getElementById('coins');
  var elDel=document.getElementById('delivered');
  var elHint=document.getElementById('hint');
  var stealBtn=document.getElementById('steal');
  var shopEl=document.getElementById('shop');
  var joyEl=document.getElementById('joy');
  var knob=document.getElementById('knob');

  if(typeof THREE==='undefined'){
    elHint.textContent='Не удалось загрузить 3D-движок. Обновите страницу.';
    return;
  }
  var renderer;
  try{
    renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true,alpha:true});
  }catch(err){
    elHint.textContent='Это устройство не поддерживает 3D-графику.';
    return;
  }
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.setClearColor(0x000000,0);

  /* ---------- save ---------- */
  var S={coins:0,lvl:0,delivered:0};
  try{
    var raw=localStorage.getItem('steal-the-egg-v1');
    if(raw){
      var d=JSON.parse(raw);
      S.coins=Math.max(0,d.coins|0);
      S.lvl=Math.min(MAX_LVL,Math.max(0,d.lvl|0));
      S.delivered=Math.max(0,d.delivered|0);
    }
  }catch(e){}
  function save(){
    try{localStorage.setItem('steal-the-egg-v1',JSON.stringify(S));}catch(e){}
  }
  function playerSpeed(){return 150+S.lvl*20;}
  function upgradeCost(lvl){return Math.round(15*Math.pow(1.55,lvl));}

  /* ======================================================
     3D SCENE
     ====================================================== */
  var scene=new THREE.Scene();
  var camera=new THREE.PerspectiveCamera(40,W/H,30,280);
  var camBase=new THREE.Vector3(30,95,105.3);
  camera.position.copy(camBase);
  camera.lookAt(new THREE.Vector3(30,0,46));

  scene.add(new THREE.HemisphereLight(0xFFFFFF,0x9CCB7E,0.92));
  var sun=new THREE.DirectionalLight(0xFFF3D6,0.85);
  sun.position.set(5,62,55);
  sun.target.position.set(30,0,35);
  scene.add(sun.target);
  sun.castShadow=true;
  sun.shadow.mapSize.set(2048,2048);
  sun.shadow.camera.left=-48;sun.shadow.camera.right=48;
  sun.shadow.camera.top=52;sun.shadow.camera.bottom=-52;
  sun.shadow.camera.near=10;sun.shadow.camera.far=160;
  sun.shadow.bias=-0.0006;
  sun.shadow.camera.updateProjectionMatrix();
  scene.add(sun);

  var matCache={};
  function lam(c){
    if(!matCache[c])matCache[c]=new THREE.MeshLambertMaterial({color:c});
    return matCache[c];
  }
  function mk(geo,mat,x,y,z){
    var o=new THREE.Mesh(geo,mat);
    o.position.set(x||0,y||0,z||0);
    o.castShadow=true;
    return o;
  }
  function box(w,h,d,color,x,y,z){
    return mk(new THREE.BoxGeometry(w,h,d),lam(color),x,y,z);
  }
  function circ(c,x,y,r){c.beginPath();c.arc(x,y,r,0,Math.PI*2);}
  function rrc(c,x,y,w,h,r){
    c.beginPath();
    c.moveTo(x+r,y);
    c.arcTo(x+w,y,x+w,y+h,r);
    c.arcTo(x+w,y+h,x,y+h,r);
    c.arcTo(x,y+h,x,y,r);
    c.arcTo(x,y,x+w,y,r);
    c.closePath();
  }

  /* ---- baseplate texture: grass with plastic studs (painted once) ---- */
  var M=60;
  var gCanvas=document.createElement('canvas');
  gCanvas.width=(W+2*M)*2;gCanvas.height=(H+2*M)*2;
  (function(){
    var g=gCanvas.getContext('2d');
    g.scale(2,2);g.translate(M,M);
    g.fillStyle='#4DAE45';g.fillRect(-M,-M,W+2*M,H+2*M);
    g.fillStyle='#5CC652';g.fillRect(0,0,W,H);
    // sand path from nest to base
    g.fillStyle='#E9CF93';
    rrc(g,NEST.x-34,NEST.y,68,BASE.y-NEST.y+10,10);g.fill();
    // nest clearing
    g.fillStyle='#E9CF93';circ(g,NEST.x,NEST.y,122);g.fill();
    g.strokeStyle='#C9A45E';g.lineWidth=6;circ(g,NEST.x,NEST.y,122);g.stroke();
    // studs on everything
    for(var sx=-M+15;sx<W+M;sx+=30){
      for(var sy=-M+15;sy<H+M;sy+=30){
        g.fillStyle='rgba(0,0,0,.15)';circ(g,sx+2,sy+2.5,8.5);g.fill();
        g.fillStyle='rgba(255,255,255,.2)';circ(g,sx,sy,8.5);g.fill();
        g.strokeStyle='rgba(0,0,0,.1)';g.lineWidth=1.5;circ(g,sx,sy,8.5);g.stroke();
      }
    }
  })();
  var groundTex=new THREE.CanvasTexture(gCanvas);
  groundTex.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());
  var ground=new THREE.Mesh(
    new THREE.PlaneGeometry((W+2*M)*K,(H+2*M)*K),
    new THREE.MeshLambertMaterial({map:groundTex})
  );
  ground.rotation.x=-Math.PI/2;
  ground.position.set(30,0.01,35);
  ground.receiveShadow=true;
  scene.add(ground);

  // stepped island under the baseplate
  var slabTop=new THREE.Mesh(new THREE.BoxGeometry(72.6,0.8,82.6),lam(0x3F9A3A));
  slabTop.position.set(30,-0.4,35);slabTop.receiveShadow=true;scene.add(slabTop);
  var slab=new THREE.Mesh(new THREE.BoxGeometry(72,5,82),lam(0x8B5A2B));
  slab.position.set(30,-3.3,35);scene.add(slab);
  var slab2=new THREE.Mesh(new THREE.BoxGeometry(62,7,72),lam(0x6B4420));
  slab2.position.set(30,-9,35);scene.add(slab2);

  // colorful toy-brick border (far side, left, right)
  var brickCols=[0xFF4D4D,0xFFC83D,0x3D9BFF,0x2ED36B];
  var studGeo=new THREE.CylinderGeometry(0.5,0.5,0.35,12);
  function brickRow(x0,z0,dx,dz,count,len,thick){
    for(var i=0;i<count;i++){
      var col=brickCols[i%4];
      var cx=x0+dx*(i+0.5)*len, cz=z0+dz*(i+0.5)*len;
      var w=dx?len*0.97:thick, d=dz?len*0.97:thick;
      var b=mk(new THREE.BoxGeometry(w,1.7,d),lam(col),cx,0.85,cz);
      b.receiveShadow=true;scene.add(b);
      for(var k=-1;k<=1;k+=2){
        var s=new THREE.Mesh(studGeo,lam(col));
        s.position.set(cx+(dx?k*len*0.22:0),1.85,cz+(dz?k*len*0.22:0));
        scene.add(s);
      }
    }
  }
  brickRow(-2.4,-1.6,1,0,16,4.0,1.6);
  brickRow(-1.6,-2.4,0,1,19,3.9,1.6);
  brickRow(61.6,-2.4,0,1,19,3.9,1.6);

  // blocky trees and bushes in the margin
  function tree(x,z,s){
    var gr=new THREE.Group();
    gr.add(box(1.3,3.2,1.3,0x8B5A2B,0,1.6,0));
    var l1=box(4.6,2.6,4.6,0x2E9F4E,0,4.4,0);l1.rotation.y=0.3;gr.add(l1);
    var l2=box(3.6,2.4,3.6,0x39B85C,0,6.8,0);l2.rotation.y=-0.2;gr.add(l2);
    gr.add(box(2.3,2.2,2.3,0x4BCB6D,0,9.0,0));
    gr.position.set(x,0,z);gr.scale.setScalar(s);
    scene.add(gr);
  }
  var treeSpots=[[-4,6,.9],[-4.2,20,1.1],[-3.8,36,.85],[-4.1,52,1],[-4,66,.9],
                 [64,4,1],[64.2,18,.85],[63.9,33,1.1],[64,50,.9],[64.1,66,1],
                 [12,-4.4,1],[26,-4.6,1.2],[42,-4.2,.9],[54,-4.5,1]];
  treeSpots.forEach(function(t){tree(t[0],t[1],t[2]);});
  function bush(x,z,s){
    var b=box(2.8*s,1.8*s,2.8*s,0x35B055,x,0.9*s,z);
    b.rotation.y=x;scene.add(b);
  }
  bush(-3.6,12,1);bush(64,26,1.2);bush(-3.4,44,1.1);bush(63.6,58,1);bush(20,-3.6,1);bush(48,-3.7,1.1);
  function rock(x,z,s){
    var r=box(2.4*s,1.4*s,1.9*s,0xA7ADB8,x,0.7*s,z);
    r.rotation.y=x*0.7;r.receiveShadow=true;scene.add(r);
    var r2=box(1.3*s,0.9*s,1.2*s,0x8F95A1,x+1.1*s,0.45*s,z+0.9*s);
    r2.rotation.y=0.6;scene.add(r2);
  }
  rock(8,12,1);rock(52,34,1.2);rock(10,45,0.8);rock(51,8,0.9);

  // blocky clouds
  var clouds=[];
  (function(){
    var cm=new THREE.MeshBasicMaterial({color:0xFFFFFF});
    var defs=[[8,26,-22],[48,31,-30],[80,24,-18]];
    defs.forEach(function(df){
      var c=new THREE.Group();
      [[0,0,0,6,2.6,3.6],[4.4,-0.6,0.4,4.4,2,3],[-4.2,-0.7,-0.3,4,2,3],[0.6,1.8,-0.6,3.8,2,2.8]].forEach(function(b){
        var s=new THREE.Mesh(new THREE.BoxGeometry(b[3],b[4],b[5]),cm);
        s.position.set(b[0],b[1],b[2]);c.add(s);
      });
      c.position.set(df[0],df[1],df[2]);
      scene.add(c);clouds.push(c);
    });
  })();

  /* ---- eggs ---- */
  var eggTexCanvas=document.createElement('canvas');
  eggTexCanvas.width=256;eggTexCanvas.height=128;
  (function(){
    var g=eggTexCanvas.getContext('2d');
    g.fillStyle='#FFF6E0';g.fillRect(0,0,256,128);
    var seed=11;
    function rnd(){seed=(seed*16807)%2147483647;return seed/2147483647;}
    g.fillStyle='#E3C189';
    for(var i=0;i<30;i++){
      g.beginPath();
      g.ellipse(rnd()*256,18+rnd()*92,3+rnd()*6,2+rnd()*4,rnd()*3,0,Math.PI*2);
      g.fill();
    }
  })();
  var eggTex=new THREE.CanvasTexture(eggTexCanvas);
  var eggGeo=new THREE.SphereGeometry(1,22,16);
  var eggMatWhite=new THREE.MeshLambertMaterial({map:eggTex});
  var eggMatGold=new THREE.MeshStandardMaterial({color:0xFFC400,metalness:0.55,roughness:0.28,emissive:0x6B4200});
  function setEggScale(egg,s){egg.mesh.scale.set(0.78*s,s,0.78*s);}
  function newEgg(gold){
    var egg={gold:gold,mesh:null};
    egg.mesh=new THREE.Mesh(eggGeo,gold?eggMatGold:eggMatWhite);
    egg.mesh.castShadow=true;
    setEggScale(egg,1.7);
    scene.add(egg.mesh);
    return egg;
  }

  /* ---- nest: square log frame with hay ---- */
  var nestG=new THREE.Group();
  nestG.position.set(NEST.x*K,0,NEST.y*K);
  (function(){
    nestG.add(box(11.8,1.5,1.5,0x8A5A2B,0,0.75,-5.15));
    nestG.add(box(11.8,1.5,1.5,0x8A5A2B,0,0.75,5.15));
    nestG.add(box(1.5,1.5,11.8,0x7A4C22,-5.15,0.75,0));

  /* ---------- update (game logic) ---------- */
  function update(dt){
    T+=dt;

    var ix=joy.x,iy=joy.y;
    if(keys.ArrowLeft||keys.KeyA)ix-=1;
    if(keys.ArrowRight||keys.KeyD)ix+=1;
    if(keys.ArrowUp||keys.KeyW)iy-=1;
    if(keys.ArrowDown||keys.KeyS)iy+=1;
    var m=Math.hypot(ix,iy);
    if(m>1){ix/=m;iy/=m;m=1;}
    if(m<0.12){ix=0;iy=0;m=0;}
    var sp=playerSpeed()*(player.carry?0.88:1);
    player.moving=m>0;
    player.x=Math.min(W-22,Math.max(22,player.x+ix*sp*dt));
    player.y=Math.min(H-22,Math.max(22,player.y+iy*sp*dt));
    if(m>0)player.face=turn(player.face,Math.atan2(ix,iy),dt*14);
    if(player.invuln>0)player.invuln-=dt;
    if(flash>0)flash-=dt;
    if(shake>0)shake-=dt;

    regen+=dt;
    if(regen>=5){
      regen=0;
      if(nestEggs.length<5)nestEggs.unshift(newEgg(Math.random()<0.2));
    }

    var safe=inBase(player);
    var aggro=player.carry?250:185;
    var leash=player.carry?245:205;
    var dn=dist(player,NEST);
    var chasing=!safe&&dn<aggro&&player.invuln<=0;
    monster.chase=chasing;

    var chaseSpeed=Math.min(165,105+stolenTotal*3);
    var tx,ty,ms;
    if(chasing){
      tx=player.x;ty=player.y;ms=chaseSpeed;
    }else{
      monster.ang+=dt*1.1;
      tx=NEST.x+Math.cos(monster.ang)*105;
      ty=NEST.y+Math.sin(monster.ang)*105;
      ms=chaseSpeed*0.72;
    }
    var dx=tx-monster.x,dy=ty-monster.y,dd=Math.hypot(dx,dy);
    if(dd>1){
      var step=Math.min(dd,ms*dt);
      monster.x+=dx/dd*step;monster.y+=dy/dd*step;
      monster.lx=dx/dd;monster.ly=dy/dd;
    }
    var mn=dist(monster,NEST);
    if(mn>leash){
      monster.x=NEST.x+(monster.x-NEST.x)/mn*leash;
      monster.y=NEST.y+(monster.y-NEST.y)/mn*leash;
    }
    monster.face=turn(monster.face,Math.atan2(monster.lx,monster.ly),dt*10);

    if(!safe&&player.invuln<=0&&dist(monster,player)<46)caught();
    if(player.carry&&inBase(player))deliver();

    for(var i=floaters.length-1;i>=0;i--){
      var f=floaters[i];f.life-=dt;f.h+=4*dt;
      if(f.life<=0){scene.remove(f.sp);f.sp.material.dispose();floaters.splice(i,1);}
    }
    for(var j=parts.length-1;j>=0;j--){
      var p=parts[j];p.life-=dt;
      p.vy-=40*dt;
      p.m.position.x+=p.vx*dt;p.m.position.y+=p.vy*dt;p.m.position.z+=p.vz*dt;
      p.m.rotation.x+=p.sp*dt;p.m.rotation.y+=p.sp*dt;
      if(p.life<=0||p.m.position.y<0){scene.remove(p.m);parts.splice(j,1);}
    }
  }

  function sync3D(dt){

    var tgtLift=inBase(player)?BASE_H:0;
    player.lift+=(tgtLift-player.lift)*Math.min(1,dt*14);
    var walk=player.moving?1:0;
    pWalk+=dt*walk*13;
    var swing=Math.sin(pWalk)*0.9*walk;
    var hop=player.moving?Math.abs(Math.sin(pWalk))*0.2:0;
    var idle=Math.sin(T*3)*0.05;
    playerG.position.set(player.x*K,player.lift+hop,player.y*K);
    playerG.rotation.y=player.face;
    P.legL.rotation.x=swing;P.legR.rotation.x=-swing;
    if(player.carry){
      P.armL.rotation.x=-2.9+Math.sin(T*10)*0.08;
      P.armR.rotation.x=-2.9-Math.sin(T*10)*0.08;
    }else{
      P.armL.rotation.x=-swing+idle;P.armR.rotation.x=swing-idle;
    }
    pCarry.position.y=P.top+1.9+Math.sin(T*8)*0.12;
    pCarry.rotation.z=Math.sin(T*10)*0.1;
    playerG.visible=!(player.invuln>0&&Math.floor(T*12)%2===0);

    // monster
    mWalk+=dt*(monster.chase?15:8);
    var ms=Math.sin(mWalk);
    var pulse=1+(monster.chase?0.08+Math.sin(T*20)*0.02:Math.sin(T*3)*0.02);
    monG.position.set(monster.x*K,Math.abs(ms)*(monster.chase?0.55:0.3),monster.y*K);
    monG.rotation.y=monster.face;
    Mo.legL.rotation.x=ms*0.8;Mo.legR.rotation.x=-ms*0.8;
    if(monster.chase){
      Mo.armL.rotation.x=-2.3+Math.sin(T*18)*0.25;
      Mo.armR.rotation.x=-2.3-Math.sin(T*18)*0.25;
    }else{
      Mo.armL.rotation.x=-ms*0.6;Mo.armR.rotation.x=ms*0.6;
    }
    Mo.head.scale.set(pulse,pulse,pulse);

    // floating text
    for(var i=0;i<floaters.length;i++){
      var f=floaters[i];
      f.sp.position.set(f.x,f.h,f.z);
      f.sp.material.opacity=Math.min(1,f.life*2);
    }

    // clouds
    for(var c=0;c<clouds.length;c++){
      clouds[c].position.x+=dt*1.4;
      if(clouds[c].position.x>100)clouds[c].position.x=-40;
    }

    // flag
    flag.rotation.y=Math.sin(T*4)*0.35;
    flag.position.x=-9.5+Math.sin(T*4)*0.15;

    // camera shake
    if(shake>0){
      var a=shake*1.6;
      camera.position.set(camBase.x+(Math.random()-0.5)*a,camBase.y+(Math.random()-0.5)*a,camBase.z+(Math.random()-0.5)*a);
    }else if(camera.position.x!==camBase.x||camera.position.y!==camBase.y){
      camera.position.copy(camBase);
    }

    // red flash overlay
    var fo=flash>0?Math.min(0.45,flash*0.7):0;
    if(fo!==lastFlash){flashEl.style.opacity=fo;lastFlash=fo;}
  }

  /* ---------- DOM ---------- */
  var lastHint='',lastCan=null;
  function renderHud(){
    elCoins.textContent=S.coins;
    elDel.textContent=S.delivered;
  }
  function renderUi(){
    var can=canSteal();
    var carry=!!player.carry;
    if(can!==lastCan){
      stealBtn.disabled=!can;
      stealBtn.classList.toggle('ready',can);
      lastCan=can;
    }
    var h;
    if(carry)h='Неси яйцо на <b>базу</b> и не дай монстру себя поймать';
    else if(can)h='Жми <b>КРАСТЬ</b>';
    else if(nestEggs.length===0)h='В гнезде пусто. Подожди, пока снесут новые яйца';
    else h='Подкрадись к <b>гнезду</b>, обходи монстра';
    if(h!==lastHint){elHint.innerHTML=h;lastHint=h;}
  }

  var pipsEl=document.getElementById('pips');
  var buyBtn=document.getElementById('buy');
  for(var pi=0;pi<MAX_LVL;pi++)pipsEl.appendChild(document.createElement('i'));
  function renderShop(){
    document.getElementById('shopCoins').textContent=S.coins;
    var now=playerSpeed();
    var maxed=S.lvl>=MAX_LVL;
    document.getElementById('shopSpeeds').textContent=maxed?now+' (максимум)':now+' → '+(now+20);
    var pips=pipsEl.children;
    for(var i=0;i<pips.length;i++)pips[i].className=i<S.lvl?'on':'';
    if(maxed){
      buyBtn.disabled=true;
      buyBtn.textContent='Максимум';
    }else{
      var c=upgradeCost(S.lvl);
      buyBtn.disabled=S.coins<c;
      buyBtn.innerHTML='Улучшить <span class="coin"></span>'+c;
    }
  }
  function openShop(){
    paused=true;joyReset();keys={};
    renderShop();
    shopEl.hidden=false;
  }
  function closeShop(){
    shopEl.hidden=true;paused=false;
  }
  document.getElementById('shopBtn').addEventListener('click',openShop);
  document.getElementById('closeShop').addEventListener('click',closeShop);
  shopEl.addEventListener('pointerdown',function(e){if(e.target===shopEl)closeShop();});
  buyBtn.addEventListener('click',function(){
    if(S.lvl>=MAX_LVL)return;
    var c=upgradeCost(S.lvl);
    if(S.coins<c)return;
    S.coins-=c;S.lvl++;
    save();renderHud();renderShop();
    vibrate(20);
  });
  stealBtn.addEventListener('pointerdown',function(e){doSteal();e.preventDefault();});
  stealBtn.addEventListener('click',function(e){if(e.detail===0)doSteal();});

  /* ---------- sizing + loop ---------- */
  function resize(){
    var r=stage.getBoundingClientRect();
    var avW=Math.max(60,r.width-16),avH=Math.max(60,r.height-16);
    var scale=Math.min(avW/W,avH/H);
    var cw=Math.floor(W*scale),ch=Math.floor(H*scale);
    canvas.style.width=cw+'px';
    canvas.style.height=ch+'px';
    renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2.5));
    renderer.setSize(cw,ch,false);
    flashEl.style.left=(r.width-cw)/2+'px';
    flashEl.style.top=(r.height-ch)/2+'px';
    flashEl.style.width=cw+'px';
    flashEl.style.height=ch+'px';
  }
  if(window.ResizeObserver)new ResizeObserver(resize).observe(stage);
  window.addEventListener('resize',resize);
  resize();

  var last=0;
  function frame(ts){
    var dt=Math.min(0.05,(ts-last)/1000||0);
    last=ts;
    if(!paused&&!document.hidden)update(dt);
    sync3D(paused?0:dt);
    renderer.render(scene,camera);
    renderUi();
    requestAnimationFrame(frame);
  }
  renderHud();
  requestAnimationFrame(function(ts){last=ts;requestAnimationFrame(frame);});
})();
</script>

</html>
