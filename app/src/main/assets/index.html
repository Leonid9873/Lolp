<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
</head>
<body>
<title>Башня испытаний</title>
<style>
:root{--bg:#10131c;--ink:#fff;--glass:rgba(16,19,28,.62);--line:rgba(255,255,255,.2);--acc:#ffd23f;--bad:#ff4d4d;--joy:clamp(116px,32vmin,170px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;touch-action:none}
[hidden]{display:none!important}
.stage{position:fixed;inset:0}
canvas{width:100%;height:100%;display:block;touch-action:none}
.ui{position:absolute;inset:0;pointer-events:none;padding:max(10px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.hud{display:flex;justify-content:center;gap:10px}
.pill{background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:6px 14px;text-align:center;min-width:84px}
.pill small{display:block;font-size:11px;opacity:.7;letter-spacing:.04em;text-transform:uppercase}
.pill b{font-size:20px;font-variant-numeric:tabular-nums}
#time.low{color:var(--bad)}
.cross{position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px;border-radius:50%;background:rgba(255,255,255,.7)}
#toast{position:absolute;left:50%;top:22%;transform:translateX(-50%);background:var(--glass);border:1px solid var(--bad);border-radius:12px;padding:8px 16px;font-weight:700}
#joy{position:absolute;left:max(16px,env(safe-area-inset-left));bottom:max(18px,env(safe-area-inset-bottom));width:var(--joy);height:var(--joy);border-radius:50%;background:rgba(255,255,255,.12);border:2px solid var(--line);pointer-events:auto;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:42%;height:42%;border-radius:50%;background:rgba(255,255,255,.55);transform:translate(-50%,-50%)}
#jump{position:absolute;right:max(16px,env(safe-area-inset-right));bottom:max(24px,env(safe-area-inset-bottom));width:calc(var(--joy)*.78);height:calc(var(--joy)*.78);border-radius:50%;border:3px solid #fff;background:var(--acc);color:#222;font:800 16px system-ui;pointer-events:auto;touch-action:none}
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(10,12,20,.55);pointer-events:auto;padding:16px}
.card{width:min(420px,100%);background:var(--glass);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:20px;padding:22px;text-align:center;display:grid;gap:12px}
.card h1,.card h2{margin:0;font-size:28px}
.card p{margin:0;opacity:.85;line-height:1.4}
button.btn{font:700 17px system-ui;color:#222;background:var(--acc);border:0;border-radius:14px;padding:14px;cursor:pointer}
button.alt{background:rgba(255,255,255,.14);color:#fff;border:1px solid var(--line);font-weight:600;font-size:14px}
</style>
<div class="stage" id="stage">
  <canvas id="game"></canvas>
  <div class="ui">
    <div class="hud">
      <div class="pill"><small>Время</small><b id="time">8:00</b></div>
      <div class="pill"><small>Этаж</small><b id="floor">0/12</b></div>
      <div class="pill"><small>Рекорд</small><b id="best">–</b></div>
    </div>
    <div class="cross"></div>
    <div id="toast" hidden></div>
    <div id="joy"><div id="knob"></div></div>
    <button id="jump" type="button">ПРЫЖОК</button>
    <div class="overlay" id="menu">
      <div class="card">
        <h1>Башня испытаний</h1>
        <p>Забирайся на вершину за 8 минут. Башня каждый раз новая. Красное убивает, упал — начинай заново.</p>
        <button class="btn" id="play" type="button">Играть</button>
        <button class="btn alt" id="modeBtn" type="button">Режим: сложный (без чекпоинтов)</button>
        <p style="font-size:13px;opacity:.65">Джойстик слева — ходьба, свайп по экрану — взгляд. Компьютер: WASD, мышь-перетаскивание, пробел.</p>
      </div>
    </div>
    <div class="overlay" id="end" hidden>
      <div class="card">
        <h2 id="endTitle"></h2>
        <p id="endText"></p>
        <button class="btn" id="newTower" type="button">Новая башня</button>
        <button class="btn alt" id="again" type="button">Эта же башня ещё раз</button>
        <button class="btn alt" id="toMenu" type="button">В меню</button>
      </div>
    </div>
  </div>
</div>
<script src="three.min.js"></script>
<script>
(function(){
'use strict';
var canvas=document.getElementById('game'),stage=document.getElementById('stage');
var elTime=document.getElementById('time'),elFloor=document.getElementById('floor'),elBest=document.getElementById('best');
var elMenu=document.getElementById('menu'),elEnd=document.getElementById('end'),elEndTitle=document.getElementById('endTitle'),elEndText=document.getElementById('endText');
var elToast=document.getElementById('toast'),joyEl=document.getElementById('joy'),knob=document.getElementById('knob'),jumpBtn=document.getElementById('jump');
var modeBtn=document.getElementById('modeBtn');
var renderer;
try{renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true});}catch(e){document.body.insertAdjacentHTML('beforeend','<p style="position:fixed;inset:0;display:grid;place-items:center;color:#fff;padding:20px;text-align:center">Не удалось запустить 3D (WebGL)</p>');return;}
var SKY=0x9fd8ff;
var scene=new THREE.Scene();
scene.background=new THREE.Color(SKY);
scene.fog=new THREE.Fog(SKY,45,190);
var camera=new THREE.PerspectiveCamera(75,1,0.1,500);
camera.rotation.order='YXZ';
scene.add(camera);
scene.add(new THREE.HemisphereLight(0xffffff,0x7080b0,0.95));
var sun=new THREE.DirectionalLight(0xffffff,0.55);sun.position.set(40,90,25);scene.add(sun);

function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
var rnd=Math.random;
function fmtTime(s){s=Math.max(0,s);var m=Math.floor(s/60),x=Math.floor(s%60);return m+':'+(x<10?'0':'')+x;}

/* ---------------- tower generation ---------------- */
var SECTIONS=12,RISE=1.5,TIME_LIMIT=480;
var solids=[],kills=[],movers=[],spinners=[],towerGroup=new THREE.Group();
scene.add(towerGroup);
var landings=[];
var boxGeo=new THREE.BoxGeometry(1,1,1);
var killMat=new THREE.MeshLambertMaterial({color:0xff2b2b,emissive:0x660000});
function clearTower(){
  scene.remove(towerGroup);
  towerGroup.traverse(function(o){if(o.material&&o.material!==killMat)o.material.dispose();});
  towerGroup=new THREE.Group();scene.add(towerGroup);
  solids=[];kills=[];movers=[];spinners=[];landings=[];
}
function mkBox(cx,cy,cz,sx,sy,sz,mat){
  var m=new THREE.Mesh(boxGeo,mat);
  m.scale.set(sx,sy,sz);m.position.set(cx,cy,cz);
  towerGroup.add(m);
  return m;
}
function addSolid(o){o.hx=o.sx/2;o.hy=o.sy/2;o.hz=o.sz/2;o.dx=o.dy=o.dz=0;return o;}
function setBounds(s){s.x0=s.cx-s.hx;s.x1=s.cx+s.hx;s.y0=s.cy-s.hy;s.y1=s.cy+s.hy;s.z0=s.cz-s.hz;s.z1=s.cz+s.hz;}

var spawn={x:0,y:0,z:0};
function buildTower(seed){
  clearTower();
  var R=mulberry(seed);
  var ox=0,oy=0,oz=0,dir=0;
  var DIRS=[[0,-1],[1,0],[0,1],[-1,0]];
  var last=-1;
  var types=['gaps','stripes','beam','moving','spinner','pillars'];
  for(var i=0;i<=SECTIONS;i++){
    var f=DIRS[dir%4],fx=f[0],fz=f[1],rx=-fz,rz=fx;
    var hue=(i/SECTIONS)*0.85;
    var col=new THREE.Color().setHSL(hue,0.65,0.58);
    var mat=new THREE.MeshLambertMaterial({color:col});
    var matD=new THREE.MeshLambertMaterial({color:new THREE.Color().setHSL(hue,0.55,0.42)});
    /* world position from local (lx across, lz along) */
    var W=function(lx,lz){return {x:ox+fx*lz+rx*lx,z:oz+fz*lz+rz*lx};};
    var P=function(lx,top,lz,w,d,m,kill,thick){
      thick=thick||1;
      var p=W(lx,lz);
      var sx=(fx!==0)?d:w,sz=(fx!==0)?w:d;
      var s=addSolid({cx:p.x,cy:top-thick/2,cz:p.z,sx:sx,sy:thick,sz:sz,kill:!!kill});
      s.mesh=mkBox(s.cx,s.cy,s.cz,sx,thick,sz,kill?killMat:(m||mat));
      setBounds(s);
      (kill?kills:solids).push(s);
      return s;
    };
    var base=oy;
    /* landing */
    var L=P(0,base,0,6,6,matD,false,1.2);
    landings.push(L);
    if(i===SECTIONS){
      L.goal=true;
      var gp=W(0,0);
      var gm=new THREE.MeshLambertMaterial({color:0xffd23f,emissive:0x664400});
      mkBox(gp.x,base+2.2,gp.z,0.5,4.4,0.5,gm);
      mkBox(gp.x+0.9,base+3.8,gp.z,1.8,1.0,0.1,gm);
      break;
    }
    /* pick section type */
    var t;
    do{t=types[Math.floor(R()*types.length)];}while(t===last);
    last=t;
    var k;
    if(t==='gaps'){
      for(k=0;k<4;k++)P((R()-0.5)*3,base+RISE*(k+1)/5,4.6+k*4.6,3,2.7,mat,false,0.8);
    }else if(t==='stripes'){
      P(0,base+0.75,12,3.4,18,mat,false,0.8);
      var sp=[7,12,17];
      for(k=0;k<3;k++){
        var kk=P(0,base+0.75+0.45,sp[k]+(R()-0.5)*1.5,3.4,1.2,null,true,0.45);
      }
    }else if(t==='beam'){
      P(0,base+0.75,12,1.1,18,mat,false,0.8);
      P(0,base+0.75+0.45,9+R()*1.5,1.1,0.9,null,true,0.45);
      P(0,base+0.75+0.45,15+R()*1.5,1.1,0.9,null,true,0.45);
    }else if(t==='moving'){
      for(k=0;k<3;k++){
        var ls=6+k*6;
        var topM=base+0.5+k*0.5;
        var s=P(0,topM,ls,3,3,mat,false,0.8);
        s.mv={lx:0,top:topM,lz:ls,amp:2.3,sp:1.0+R()*0.7,ph:R()*6.28,fx:fx,fz:fz,rx:rx,rz:rz,ox:ox,oz:oz};
        movers.push(s);
      }
    }else if(t==='spinner'){
      P(0,base+0.75,5.8,3,5.2,mat,false,0.8);
      var pad=P(0,base+0.75,12.5,7,7,matD,false,0.8);
      P(0,base+0.75,19,3,4.5,mat,false,0.8);
      var c=W(0,12.5);
      var bar=mkBox(c.x,base+0.75+0.35,c.z,7.4,0.7,0.5,killMat);
      spinners.push({mesh:bar,cx:c.x,cz:c.z,top:base+0.75+0.7,y0:base+0.75,len:3.7,sp:(R()<0.5?-1:1)*(1.1+R()*0.5),a:R()*6.28});
    }else{ /* pillars */
      for(k=0;k<5;k++)P((R()-0.5)*3.4,base+0.4+RISE*(k+1)/6,4.8+k*3.7,1.6,1.6,mat,false,6);
    }
    /* next origin */
    var np=W(0,24);
    ox=np.x;oz=np.z;oy=base+RISE;dir++;
  }
  spawn.x=0;spawn.y=0;spawn.z=0;
}

/* ---------------- player ---------------- */
var HW=0.4,PH=1.8,SPEED=9,GRAV=34,JUMP=12;
var P={x:0,y:0,z:0,vx:0,vy:0,vz:0,yaw:0,pitch:0,grounded:false,coyote:0,riding:null,lastGroundY:0,bob:0};
var game={state:'menu',t:0,mode:'hard',seed:1,best:{},checkpoint:null,maxFloor:0,toastT:0};
var joy={x:0,y:0,id:null},look={id:null,x:0,y:0},keys={},jumpQ=0;

function loadBest(){try{var b=JSON.parse(localStorage.getItem('tower-best-v1')||'{}');if(b&&typeof b==='object')game.best=b;}catch(e){}}
function saveBest(){try{localStorage.setItem('tower-best-v1',JSON.stringify(game.best));}catch(e){}}
loadBest();

function respawn(msg){
  var c=(game.mode==='easy'&&game.checkpoint)?game.checkpoint:landings[0];
  P.x=c.cx;P.z=c.cz;P.y=c.y1+0.01;P.vx=P.vy=P.vz=0;P.grounded=true;P.riding=null;P.lastGroundY=P.y;
  if(msg)toast(msg);
}
function toast(t){elToast.textContent=t;elToast.hidden=false;game.toastT=1.6;}
function startGame(newSeed){
  if(newSeed)game.seed=Math.floor(Math.random()*1e9);
  buildTower(game.seed);
  game.state='play';game.t=0;game.checkpoint=null;game.maxFloor=0;
  respawn();
  P.yaw=0;P.pitch=-0.15;
  elMenu.hidden=true;elEnd.hidden=true;
  updateBest();
}
function updateBest(){var b=game.best.t;elBest.textContent=b?fmtTime(b):'–';}

function overlap(s,x,y,z){
  return x+HW>s.x0&&x-HW<s.x1&&y+PH>s.y0&&y<s.y1&&z+HW>s.z0&&z-HW<s.z1;
}
function die(){respawn(game.mode==='easy'?'Назад на этаж':'Упал! Снова с начала');}

function updateMovers(t){
  for(var i=0;i<movers.length;i++){
    var s=movers[i],m=s.mv;
    var off=Math.sin(t*m.sp+m.ph)*m.amp;
    var nx=m.ox+m.fx*m.lz+m.rx*off,nz=m.oz+m.fz*m.lz+m.rz*off;
    s.dx=nx-s.cx;s.dz=nz-s.cz;s.dy=0;
    s.cx=nx;s.cz=nz;s.mesh.position.set(nx,s.cy,nz);
    setBounds(s);
  }
  for(var j=0;j<spinners.length;j++){
    var sp=spinners[j];sp.a+=sp.sp*0.016;
    sp.mesh.rotation.y=sp.a;
  }
}
function hitSpinner(){
  for(var i=0;i<spinners.length;i++){
    var s=spinners[i];
    if(P.y>=s.top-0.05||P.y+PH<s.y0)continue;
    var dx=Math.cos(s.a),dz=-Math.sin(s.a);
    var px=P.x-s.cx,pz=P.z-s.cz;
    var tt=clamp(px*dx+pz*dz,-s.len,s.len);
    var qx=px-dx*tt,qz=pz-dz*tt;
    if(qx*qx+qz*qz<(HW+0.25)*(HW+0.25))return true;
  }
  return false;
}
function step(dt){
  game.t+=dt;
  updateMovers(game.t);
  /* ride */
  if(P.riding){P.x+=P.riding.dx;P.z+=P.riding.dz;}
  /* input */
  var ix=joy.x,iy=joy.y;
  if(keys.KeyA||keys.ArrowLeft)ix-=1;
  if(keys.KeyD||keys.ArrowRight)ix+=1;
  if(keys.KeyW||keys.ArrowUp)iy-=1;
  if(keys.KeyS||keys.ArrowDown)iy+=1;
  var m=Math.hypot(ix,iy);if(m>1){ix/=m;iy/=m;m=1;}
  if(m<0.1){ix=0;iy=0;}
  var fx=-Math.sin(P.yaw),fz=-Math.cos(P.yaw),rx=Math.cos(P.yaw),rz=-Math.sin(P.yaw);
  var tvx=(fx*-iy+rx*ix)*SPEED,tvz=(fz*-iy+rz*ix)*SPEED;
  var acc=P.grounded?Math.min(1,dt*18):Math.min(1,dt*6);
  P.vx+=(tvx-P.vx)*acc;P.vz+=(tvz-P.vz)*acc;
  if(jumpQ>0)jumpQ-=dt;
  if(P.grounded)P.coyote=0.1;else P.coyote-=dt;
  if(jumpQ>0&&P.coyote>0){P.vy=JUMP;P.grounded=false;P.coyote=0;jumpQ=0;P.riding=null;}
  P.vy-=GRAV*dt;if(P.vy<-60)P.vy=-60;
  var i,s;
  /* X */
  P.x+=P.vx*dt;
  for(i=0;i<solids.length;i++){s=solids[i];if(overlap(s,P.x,P.y,P.z)){
    P.x=(P.x<(s.x0+s.x1)/2)?s.x0-HW-0.001:s.x1+HW+0.001;P.vx=0;}}
  /* Z */
  P.z+=P.vz*dt;
  for(i=0;i<solids.length;i++){s=solids[i];if(overlap(s,P.x,P.y,P.z)){
    P.z=(P.z<(s.z0+s.z1)/2)?s.z0-HW-0.001:s.z1+HW+0.001;P.vz=0;}}
  /* Y */
  var prevY=P.y;
  P.y+=P.vy*dt;
  var landed=null;
  for(i=0;i<solids.length;i++){s=solids[i];if(overlap(s,P.x,P.y,P.z)){
    if(P.vy<=0&&prevY>=s.y1-0.3){P.y=s.y1;P.vy=0;landed=s;}
    else if(P.vy>0){P.y=s.y0-PH-0.001;P.vy=0;}
    else{P.y=s.y1;P.vy=0;landed=s;}
  }}
  if(!landed&&P.grounded&&P.vy<=0&&P.riding){
    /* stay glued to a moving platform */
    var r=P.riding;
    if(P.x+HW>r.x0&&P.x-HW<r.x1&&P.z+HW>r.z0&&P.z-HW<r.z1&&Math.abs(P.y-r.y1)<0.4){P.y=r.y1;landed=r;}
  }
  P.grounded=!!landed;P.riding=landed;
  if(landed){
    P.lastGroundY=P.y;
    if(landed.goal){win();return;}
    var li=landings.indexOf(landed);
    if(li>=0){
      game.maxFloor=Math.max(game.maxFloor,li);
      if(game.mode==='easy')game.checkpoint=landed;
    }
  }
  /* hazards */
  for(i=0;i<kills.length;i++){if(overlap(kills[i],P.x,P.y,P.z)){die();return;}}
  if(hitSpinner()){die();return;}
  if(P.y<P.lastGroundY-32){die();return;}
  if(game.t>=TIME_LIMIT){lose();return;}
  P.bob+=dt*(P.grounded?Math.hypot(P.vx,P.vz)*0.9:0);
}
function win(){
  game.state='end';
  var t=game.t;
  var key=game.mode;
  var rec=false;
  if(!game.best.t||t<game.best.t){game.best.t=t;rec=true;saveBest();}
  elEndTitle.textContent='Ты на вершине!';
  elEndText.textContent='Время '+fmtTime(t)+(rec?' · новый рекорд!':' · рекорд '+fmtTime(game.best.t));
  elEnd.hidden=false;updateBest();
}
function lose(){
  game.state='end';
  elEndTitle.textContent='Время вышло';
  elEndText.textContent='Ты добрался до этажа '+game.maxFloor+' из '+SECTIONS;
  elEnd.hidden=false;
}

/* ---------------- input ---------------- */
function joyMove(e){
  var r=joyEl.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  var dx=e.clientX-cx,dy=e.clientY-cy,max=r.width*0.34,d=Math.hypot(dx,dy),k=d>max?max/d:1;
  dx*=k;dy*=k;
  knob.style.transform='translate(calc(-50% + '+dx+'px), calc(-50% + '+dy+'px))';
  joy.x=dx/max;joy.y=dy/max;
}
function joyReset(){joy.id=null;joy.x=0;joy.y=0;knob.style.transform='translate(-50%, -50%)';}
joyEl.addEventListener('pointerdown',function(e){if(joy.id!==null)return;joy.id=e.pointerId;try{joyEl.setPointerCapture(e.pointerId);}catch(x){}joyMove(e);e.preventDefault();});
joyEl.addEventListener('pointermove',function(e){if(e.pointerId===joy.id){joyMove(e);e.preventDefault();}});
['pointerup','pointercancel','lostpointercapture'].forEach(function(n){joyEl.addEventListener(n,function(e){if(e.pointerId===joy.id)joyReset();});});
canvas.addEventListener('pointerdown',function(e){if(look.id!==null)return;look.id=e.pointerId;look.x=e.clientX;look.y=e.clientY;try{canvas.setPointerCapture(e.pointerId);}catch(x){}e.preventDefault();});
canvas.addEventListener('pointermove',function(e){
  if(e.pointerId!==look.id)return;
  var dx=e.clientX-look.x,dy=e.clientY-look.y;look.x=e.clientX;look.y=e.clientY;
  P.yaw-=dx*0.0055;P.pitch=clamp(P.pitch-dy*0.0045,-1.4,1.4);e.preventDefault();});
['pointerup','pointercancel','lostpointercapture'].forEach(function(n){canvas.addEventListener(n,function(e){if(e.pointerId===look.id)look.id=null;});});
jumpBtn.addEventListener('pointerdown',function(e){jumpQ=0.15;e.preventDefault();});
window.addEventListener('keydown',function(e){
  if(e.code==='Space'){if(game.state==='play')jumpQ=0.15;e.preventDefault();return;}
  keys[e.code]=true;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].indexOf(e.code)>=0)e.preventDefault();
});
window.addEventListener('keyup',function(e){keys[e.code]=false;});
window.addEventListener('blur',function(){keys={};joyReset();look.id=null;});
document.getElementById('play').addEventListener('click',function(){startGame(true);});
document.getElementById('again').addEventListener('click',function(){startGame(false);});
document.getElementById('newTower').addEventListener('click',function(){startGame(true);});
document.getElementById('toMenu').addEventListener('click',function(){game.state='menu';elEnd.hidden=true;elMenu.hidden=false;});
modeBtn.addEventListener('click',function(){
  game.mode=game.mode==='hard'?'easy':'hard';
  modeBtn.textContent=game.mode==='hard'?'Режим: сложный (без чекпоинтов)':'Режим: лёгкий (чекпоинты на этажах)';
});

/* ---------------- view ---------------- */
function resize(){
  var r=stage.getBoundingClientRect();
  var w=Math.max(2,Math.floor(r.width)),h=Math.max(2,Math.floor(r.height));
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  renderer.setSize(w,h,false);
  camera.aspect=w/h;camera.fov=(w/h>=1)?70:85;camera.updateProjectionMatrix();
}
if(window.ResizeObserver)new ResizeObserver(resize).observe(stage);
window.addEventListener('resize',resize);
resize();

/* menu backdrop: a tower so the first screen isn't empty */
buildTower(7);
P.x=landings[0].cx;P.y=landings[0].y1;P.z=landings[0].cz;
updateBest();

var last=0,lastTime='',lastFloor=-1,acc=0;
function frame(ts){
  var dt=Math.min(0.05,(ts-last)/1000||0);last=ts;
  if(game.state==='play'){
    acc+=dt;
    var n=0;
    while(acc>=0.008&&n<10){step(0.008);acc-=0.008;n++;if(game.state!=='play')break;}
  }else{
    updateMovers(ts/1000);
    if(game.state==='menu'){P.yaw+=dt*0.25;}
  }
  var cy=P.y+1.6+Math.sin(P.bob)*0.06;
  camera.position.set(P.x,cy,P.z);
  camera.rotation.set(P.pitch,P.yaw,0);
  renderer.render(scene,camera);
  var tl=fmtTime(TIME_LIMIT-game.t);
  if(game.state==='play'&&tl!==lastTime){elTime.textContent=tl;lastTime=tl;elTime.classList.toggle('low',TIME_LIMIT-game.t<60);}
  if(game.maxFloor!==lastFloor){elFloor.textContent=game.maxFloor+'/'+SECTIONS;lastFloor=game.maxFloor;}
  if(game.toastT>0){game.toastT-=dt;if(game.toastT<=0)elToast.hidden=true;}
  requestAnimationFrame(frame);
}
requestAnimationFrame(function(ts){last=ts;requestAnimationFrame(frame);});
})();

</script>
</body>
</html>
